name: harness
on:
  pull_request:
  push: { branches: [main] }

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@v5
      - run: make install
      - run: make lint
      - run: make types
      - run: make agents

      # Context bloat is invisible in review unless something surfaces it.
      - name: context budget
        run: make context

      - run: make test

      # Offline replay. No API key is exposed to PR builds on purpose: a fork PR
      # must never be able to spend your tokens or read your secrets.
      - name: evals (replay)
        run: make evals

      - name: profile is applied
        run: |
          uv run python bin/apply_profile.py --offline
          git diff --exit-code opencode.json || {
            echo "::error::opencode.json is out of sync with harness.toml. Run 'make profile'."
            exit 1; }

      - name: snapshot guard
        run: |
          if git diff --name-only origin/${{ github.base_ref || 'main' }}...HEAD \
             | grep -q '^evals/snapshots/'; then
            echo "::warning::Snapshots changed — a reviewer must confirm this is an"
            echo "::warning::intended behavior change, not a test edited to pass."
            git diff origin/${{ github.base_ref || 'main' }}...HEAD -- evals/snapshots/
          fi
